<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
<style>.t{fill:#222}@media (prefers-color-scheme:dark){.t{fill:#eee}}</style><title>Fluxo de autenticacao</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker></defs>
<g fill="#7a8ba3" fill-opacity="0.25" stroke="#888" stroke-width="1.5">
<rect x="10" y="20" width="130" height="60" rx="8"/><rect x="170" y="20" width="130" height="60" rx="8"/><rect x="330" y="20" width="130" height="60" rx="8"/><rect x="490" y="20" width="130" height="60" rx="8"/>
<rect x="490" y="140" width="130" height="60" rx="8"/></g>
<g fill="#888" stroke="#888" stroke-width="1.5" fill-opacity="0.15">
<rect x="620" y="215" width="130" height="40" rx="8" fill="#3fa34d" fill-opacity="0.35"/>
<rect x="620" y="265" width="130" height="40" rx="8" fill="#d9a400" fill-opacity="0.35"/>
<rect x="620" y="115" width="130" height="40" rx="8" fill="#d64545" fill-opacity="0.35"/></g>
<g class="t" text-anchor="middle">
<text x="75" y="46" font-weight="bold">1. register</text><text x="75" y="64">senha com BCrypt</text>
<text x="235" y="46" font-weight="bold">2. login</text><text x="235" y="64">JWT, exp curta (900s)</text>
<text x="395" y="46" font-weight="bold">3. requisicao</text><text x="395" y="64">Authorization: Bearer</text>
<text x="555" y="46" font-weight="bold">4. JwtAuthFilter</text><text x="555" y="64">assinatura + expiracao</text>
<text x="555" y="166" font-weight="bold">5. papel</text><text x="555" y="184">USER / ADMIN</text>
<text x="685" y="140">401 token invalido</text>
<text x="685" y="240">200 OK</text>
<text x="685" y="290">403 papel errado</text></g>
<g stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M140,50 H168"/><path d="M300,50 H328"/><path d="M460,50 H488"/><path d="M555,80 V138"/>
<path d="M620,70 H700 V113"/><path d="M620,170 H660 V235 H618"/><path d="M620,185 H640 V285 H618"/></g>
<text x="380" y="320" class="t" text-anchor="middle">Token ausente, expirado ou adulterado: sem autenticacao, rota protegida responde 401.</text>
</svg>
