<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="sans-serif" font-size="13">
<style>.t{fill:#222}@media (prefers-color-scheme:dark){.t{fill:#eee}}</style><title>Arquitetura em camadas</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker></defs>
<g fill="#7a8ba3" fill-opacity="0.25" stroke="#888" stroke-width="1.5">
<rect x="130" y="15" width="260" height="55" rx="8"/><rect x="130" y="100" width="260" height="55" rx="8"/><rect x="130" y="185" width="260" height="55" rx="8"/>
<rect x="130" y="270" width="260" height="55" rx="8"/><rect x="130" y="355" width="260" height="55" rx="8"/></g>
<g class="t" text-anchor="middle">
<text x="260" y="38" font-weight="bold">Security filter chain</text><text x="260" y="56">STATELESS, /auth/** publico</text>
<text x="260" y="123" font-weight="bold">JwtAuthFilter</text><text x="260" y="141">le Bearer, define Authentication</text>
